[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Note `dist init` rewrites the comments in this file.
# macOS ships only as Banshee.app: dist cannot give the daemon the microphone
# entitlement the hardened runtime needs. Windows is dropped (UDS unported).
# aarch64 Linux builds natively on ubuntu-*-arm. Source install covers the rest.
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Homebrew formula is published to this tap repo (must exist on GitHub).
tap = "yamanahlawat/homebrew-banshee"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program. The shell installer's route has no
# package manager behind it, so `banshee-update` is what a person there runs.
# Homebrew has `brew upgrade`, and the tarball is re-downloaded in place.
install-updater = true
# The window crate is not a dist package, and a --workspace build would still compile
# it; the Linux builders have no GTK for that.
precise-builds = true
# The bundle workflow listens for the release event, but a release published with the
# workflow token raises no event another workflow can see, so dist calls it instead.
post-announce-jobs = ["./app-bundle"]
# Steps the release build runs before `dist build`, read from .github/build-setup.yml.
github-build-setup = "../build-setup.yml"

# Pin Linux runners to 24.04; the ORT prebuilt needs glibc 2.38+.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

[dist.dependencies.apt]
libasound2-dev = '*'
libx11-dev = '*'
libxtst-dev = '*'
libxi-dev = '*'
libxdo-dev = '*'
