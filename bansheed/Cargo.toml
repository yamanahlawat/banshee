[package]
name = "banshee"
description = "Offline local voice daemon: push-to-talk dictation and spoken status feedback for AI coding agents"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Installed from a release archive or a tap, never from crates.io. No
# `publish = false` for that: dist reads it as a workspace with nothing to
# release, and nothing here runs `cargo publish` for it to guard.

[lints]
workspace = true

[dependencies]
arboard.workspace = true
audioadapter-buffers = "5.2.0"
banshee-common = { path = "../banshee-common" }
chrono.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
cpal = "0.18.2"
dirs.workspace = true
json5 = "1.3"
# Default "espeak" feature is off on purpose: it links espeak-ng via cmake and
# needs an espeak-ng-data dir next to the binary at runtime, which a single-file
# release install has no place for. text_to_speech::local::oov shells out instead.
misaki-rs = { version = "0.6.0", default-features = false }
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "copy-dylibs", "api-24"] }
rdev = "0.5.3"
regex = "1.13.0"
reqwest = { version = "0.13.4", features = ["rustls", "system-proxy", "blocking", "multipart", "json"], default-features = false }
ringbuf = "0.5.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
rpassword = "7.5.4"
rubato = "5.0.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
similar = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "fs"] }
toml.workspace = true
toml_edit = { version = "0.25", features = ["serde"] }
whisper-rs.workspace = true
# The mark is a png on every platform. winit is macOS only, below.
png = "0.18.1"
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies.tray-icon]
workspace = true

# `libxdo` is a default feature, and muda uses it only to work the predefined
# Copy, Cut, Paste and SelectAll menu items. This menu has none of them, so the
# feature would buy a build dependency on xdotool and nothing else.
[target.'cfg(not(target_os = "macos"))'.dependencies.tray-icon]
workspace = true
features = ["gtk"]

# arboard talks X11 by default. A Wayland session has no X11 clipboard of its
# own, so without this feature the text is set where nothing reads it.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies.arboard]
workspace = true
features = ["wayland-data-control"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
enigo = "0.6.1"
# The tray builds gtk widgets, so a gtk loop must own the thread. macOS needs no
# entry here: AppKit's own loop already serves the icon.
gtk = "0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The menu bar indicator's loop. winit runs it because tray-icon tests against
# it and it commits to no toolkit. The gtk loop serves every other platform.
winit = "0.30.13"
# The options dictionary AXIsProcessTrustedWithOptions takes; see permissions.rs.
core-foundation = "0.10"
# Posts the paste keystroke with its modifier as a flag; see dictation.rs.
core-graphics = "0.25"
# Metal + CoreML are always on for macOS (including prebuilt release binaries);
# whisper.cpp falls back to CPU at runtime if the GPU path is unavailable.
whisper-rs = { workspace = true, features = ["metal", "coreml"] }

[dev-dependencies]
hound = "3.5"

[features]
# NVIDIA GPUs on Linux/Windows; opt-in because CUDA needs the toolkit installed.
nvidia = ["whisper-rs/cuda"]
