[package]
name = "bansheed"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "banshee"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
audioadapter-buffers = "3.0.0"
banshee-common = { version = "0.1.0", path = "../banshee-common" }
clap = { version = "4.6.1", features = ["derive"] }
cpal = "0.17.3"
crossbeam-channel = "0.5.15"
enigo = "0.6.1"
ndarray = "0.17.2"
ort = "2.0.0-rc.12"
rdev = "0.5.3"
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["stream"] }
ringbuf = "0.5.0"
rodio = "0.22.2"
rubato = "3.0.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
whisper-rs = "0.16.0"


[dev-dependencies]
hound = "3.5"

[features]
# By default compile the the CPU version
default = []

# Mac
apple = ["whisper-rs/metal", "whisper-rs/coreml"]

# Linux/Windows
nvidia = ["whisper-rs/cuda"]
