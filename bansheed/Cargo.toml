[package]
name = "bansheed"
version = "0.1.0"
edition = "2024"

[dependencies]
banshee-common = { version = "0.1.0", path = "../banshee-common" }
clap = { version = "4.6.1", features = ["derive"] }
cpal = "0.17.3"
crossbeam-channel = "0.5.15"
rdev = "0.5.3"
ringbuf = "0.5.0"
rodio = "0.22.2"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
