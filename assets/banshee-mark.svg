<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Banshee mark</title>
  <!-- A shrouded, faceless figure: the keening spirit. The hem falls in two
       soft folds so the silhouette reads as cloth, not as feet. Faceless is
       deliberate; eyes turn a spirit into a cartoon at 18pt. -->
