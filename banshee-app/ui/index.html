    <!--
      THESIS: the window is the specimen sheet for a conversation held without looking at
      anything. It refuses the settings-panel arrangement the old window had, where six jobs
      formed the foot strip and the foot strip was the only navigation.
      OWN-WORLD: near-white specimen paper #FAF8F5, ink #080C0F, one burnt accent #8A2A0D.
      Archivo variable in two cuts, weight and width together; JetBrains Mono for readouts.
      No shadow, no gradient, no card. Separation by void, and by one hairline at a band edge.
      STORY: the reader sees what was said while they were not watching, tells the two
      speakers apart from the letterform alone, and copies what they came for.
      FIRST VIEWPORT: header band with the mark at 34px and the state named beside it, and
      nothing else, because a control there would offer to copy what the reader cannot see;
      body band scrolling, newest turn set large over a dense stack, each turn carrying its
      own Copy floated right, times in the accent down a narrow left gutter; foot band of
      four job values.
      FORM: Specimen, candidate 1 of the bolder hand, seed key da40a849.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
