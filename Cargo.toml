[workspace]
members = ["bansheed", "banshee-common", "banshee-app"]
resolver = "2"

[workspace.package]
version = "0.12.2"
edition = "2024"
authors = ["Yaman Ahlawat"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yamanahlawat/banshee"
homepage = "https://github.com/yamanahlawat/banshee"
readme = "README.md"
keywords = ["voice", "dictation", "mcp", "whisper", "tts"]
categories = ["command-line-utilities", "multimedia::audio"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

[patch.crates-io]
misaki-rs = { git = "https://github.com/yamanahlawat/misaki-rs", rev = "99514c28c072d8a36456b2fcec6f1bd5471bfe06" }
